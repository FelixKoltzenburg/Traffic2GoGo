# Render-Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: pendel-berater
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: STORAGE_SECRET
        generateValue: true
      - key: PENDEL_PASSWORD
        sync: false   # wird beim Anlegen in Render abgefragt
